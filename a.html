<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IARS • JARVIS Solarpunk Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--neon:#6ee7b7;--bg:#07120f;--panel:#0d1f1a;--glow:#34d399}
    body{background:radial-gradient(circle at 10% 20%, #123227 0%, var(--bg) 40%, #020807 100%);}
    .glass{background:rgba(13,31,26,.7);backdrop-filter:blur(8px);border:1px solid rgba(110,231,183,.25)}
    .pulse{animation:pulse 2.2s infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.45)}50%{box-shadow:0 0 0 16px rgba(52,211,153,0)}}
    .scan{position:relative;overflow:hidden}
    .scan:after{content:"";position:absolute;left:-120%;top:0;width:120%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:scan 3s linear infinite}
    @keyframes scan{100%{left:120%}}
  </style>
</head>
<body class="text-emerald-100 min-h-screen font-mono">
  <div class="max-w-7xl mx-auto p-4 md:p-8">
    <header class="glass rounded-2xl p-6 mb-6 flex items-center justify-between">
      <div>
        <p class="text-xs uppercase tracking-widest text-emerald-300">Techly Solarpunk AI Console</p>
        <h1 class="text-4xl md:text-6xl font-bold text-emerald-200 tracking-wide">IARS</h1>
      </div>
      <div class="text-right">
        <button id="micBtn" class="pulse bg-emerald-500/20 border border-emerald-400 px-4 py-2 rounded-xl">🎙 Voice Input</button>
        <p class="text-xs mt-2 text-emerald-300">Robotic mode: <span id="voiceState">Idle</span></p>
      </div>
    </header>

    <main class="grid md:grid-cols-3 gap-6">
      <section class="md:col-span-2 glass rounded-2xl p-4">
        <h2 class="text-xl mb-3">JARVIS Chat + Terminal</h2>
        <div id="terminal" class="scan bg-black/60 rounded-xl p-3 h-80 overflow-auto text-sm space-y-2"></div>
        <div class="mt-4 flex gap-2">
          <input id="askInput" class="flex-1 bg-black/50 border border-emerald-700 rounded-lg px-3 py-2" placeholder="Ask from bottom bar: code help, ideas, prompts..."/>
          <button id="sendBtn" class="bg-emerald-500/20 border border-emerald-400 rounded-lg px-4">Send</button>
        </div>
      </section>

      <section class="glass rounded-2xl p-4 space-y-4">
        <h2 class="text-xl">AI Tools</h2>
        <button class="w-full text-left border border-emerald-700 rounded-lg p-3" data-tool="chat">🤖 Chatbot</button>
        <button class="w-full text-left border border-emerald-700 rounded-lg p-3" data-tool="code">💻 Code Helper</button>
        <button class="w-full text-left border border-emerald-700 rounded-lg p-3" data-tool="image">🖼 Image Generator</button>
        <input id="apiKey" type="password" class="w-full bg-black/50 border border-emerald-700 rounded-lg px-3 py-2" placeholder="Your OpenAI API key (kept local)" />
        <p class="text-xs text-emerald-300">Demo UI only. For real OpenAI calls, add backend and secure key storage.</p>
      </section>
    </main>
  </div>

<script>
const terminal = document.getElementById('terminal');
const askInput = document.getElementById('askInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const voiceState = document.getElementById('voiceState');

function log(line, who='SYS'){
  const row=document.createElement('div');
  row.innerHTML=`<span class='text-emerald-400'>[${new Date().toLocaleTimeString()}] ${who}:</span> ${line}`;
  terminal.appendChild(row); terminal.scrollTop=terminal.scrollHeight;
}

function fakeAssistant(q){
  const lower=q.toLowerCase();
  if(lower.includes('code')) return 'Code Mode: I can help architect APIs, debug logic, and generate snippets.';
  if(lower.includes('image')) return 'Image Mode: Describe style + subject + mood, and I generate prompt-ready image specs.';
  return 'JARVIS Online: I heard you. Connect this input to OpenAI Responses API for live assistant answers.';
}

function ask(){
  const q=askInput.value.trim(); if(!q) return;
  log(q,'YOU');
  setTimeout(()=>log(fakeAssistant(q),'IARS'),400);
  askInput.value='';
}
sendBtn.onclick=ask;
askInput.addEventListener('keydown',e=>{if(e.key==='Enter') ask();});

micBtn.onclick=()=>{
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){log('SpeechRecognition not supported in this browser.','WARN');return;}
  const rec=new SR(); rec.lang='en-US'; rec.interimResults=false;
  voiceState.textContent='Listening...';
  rec.onresult=(e)=>{const text=e.results[0][0].transcript; askInput.value=text; log(text,'VOICE'); ask();};
  rec.onerror=()=>{voiceState.textContent='Error';};
  rec.onend=()=>{voiceState.textContent='Idle';};
  rec.start();
}

log('IARS boot complete. Ask from the bottom bar.','SYS');
</script>
</body>
</html>
